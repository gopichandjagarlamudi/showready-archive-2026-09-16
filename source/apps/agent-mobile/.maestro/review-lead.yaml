appId: ${APP_ID}
---
- runFlow: open-app.yaml
- openLink: showready://new-leads
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- assertVisible:
    id: new-leads-screen
- assertVisible:
    id: new-lead-card-e357e934-6f9a-4d75-bf12-8db0cd1bf701
- scrollUntilVisible:
    element:
      id: review-confirm-e357e934-6f9a-4d75-bf12-8db0cd1bf701
    direction: DOWN
    timeout: 8000
- tapOn:
    id: review-confirm-e357e934-6f9a-4d75-bf12-8db0cd1bf701
- assertNotVisible:
    id: new-lead-card-e357e934-6f9a-4d75-bf12-8db0cd1bf701
